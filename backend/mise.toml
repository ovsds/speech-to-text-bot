# aiogram supports Python <3.15 only
[tools]
python = "3.14.8"

[env]
SETTINGS_PATH = "{{config_root}}/.settings/dev.yaml"
SETTINGS_TEST_PATH = "{{config_root}}/.settings/test.yaml"
SETTINGS_WORKER_PATH = "{{config_root}}/.settings/worker.yaml"
APP_PORT = "8080"
_.file = "../docker/.env"

[tasks.init]
description = "Initialize environment"
run = [
  "echo 'Installing python dependencies...'",
  "poetry install --no-root --with dev",
]

[tasks.lint]
description = "Run lint checks"
run = [
  "echo 'Running poetry checks...'",
  "poetry check --lock",

  "echo 'Running deptry checks...'",
  ".venv/bin/deptry .",

  "echo 'Running black checks...'",
  ".venv/bin/python -m black --check .",

  "echo 'Running toml-sort checks...'",
  ".venv/bin/toml-sort --check pyproject.toml poetry.toml",

  "echo 'Running sort-all checks...'",
  ".venv/bin/sort-all --check $(find bin lib tests -name '*.py')",

  "echo 'Running ruff checks...'",
  ".venv/bin/python -m ruff check bin lib tests",

  "echo 'Running pyright checks...'",
  "npx --no -- pyright",
]

[tasks.lint-fix]
description = "Fix lint issues"
run = [
  "echo 'Running poetry fixes...'",
  "poetry lock",
  "poetry check",

  "echo 'Running deptry checks...'",
  ".venv/bin/deptry .",

  "echo 'Running black fixes...'",
  ".venv/bin/python -m black --safe .",

  "echo 'Running toml-sort fixes...'",
  ".venv/bin/toml-sort --in-place pyproject.toml poetry.toml",

  "echo 'Running sort-all fixes...'",
  ".venv/bin/sort-all --no-error-on-fix $(find bin lib tests -name '*.py')",

  "echo 'Running ruff fixes...'",
  ".venv/bin/python -m ruff check --fix bin lib tests",

  "echo 'Running pyright checks...'",
  "npx --no -- pyright",
]

[tasks.image-bake]
description = "Build image target from docker-bake.hcl"
usage = 'arg "<target>"'
run = [
  'echo "Building image ${usage_target}..."',
  'docker buildx bake "${usage_target}"',
]

[tasks.image-scan]
description = "Scan image for vulnerabilities"
usage = 'arg "[target]" default="runtime"'
run = [
  "echo 'Scanning image for vulnerabilities...'",
  'trivy image --config trivy.yaml "speech-to-text-bot:${usage_target}"',
]

[tasks.test]
description = "Run tests, extra arguments are passed to pytest"
run = [
  "echo 'Running pytest...'",
  ".venv/bin/python -m pytest",
]

[tasks.test-container]
description = "Run tests in container"
run = [
  { task = "image-bake tests_dev" },
  { task = "image-run tests" },
]

[tasks.test-coverage-run]
description = "Run tests with coverage"
run = [
  "echo 'Running test coverage...'",
  ".venv/bin/python -m coverage run -m pytest tests",
]

[tasks.test-coverage-report]
description = "Show test coverage report"
run = [
  "echo 'Reporting test coverage...'",
  ".venv/bin/python -m coverage report -m",
]

[tasks.test-coverage-html]
description = "Show test coverage report in browser"
run = [
  "echo 'Generating test coverage report...'",
  ".venv/bin/python -m coverage html",
  '.venv/bin/python -m webbrowser -t "file://$PWD/htmlcov/index.html"',
]

[tasks.clean]
description = "Clean environment"
run = [
  "echo 'Cleaning python dependencies...'",
  "rm -rf .venv",

  "echo 'Cleaning python cache...'",
  "find . -name __pycache__ -type d -exec rm -rf {} +",

  "echo 'Cleaning pytest cache...'",
  "rm -rf .pytest_cache",

  "echo 'Cleaning ruff cache...'",
  "rm -rf .ruff_cache",

  "echo 'Cleaning coverage results...'",
  "rm -rf .coverage",
  "rm -rf htmlcov",
]

[tasks.dependencies-update]
description = "Update python dependencies"
run = [
  "echo 'Updating python dependencies...'",
  "poetry update",
]

[tasks.dependencies-check]
description = "Check python dependencies"
run = [
  "echo 'Checking python dependencies...'",
  "poetry show --outdated",
]

[tasks.dev-server-start]
description = "Start development application"
run = [
  "echo 'Starting server...'",
  ".venv/bin/python -m bin.main",
]

[tasks.dev-server-tunnel-start]
description = "Start ngrok tunnel for development application"
run = [
  "echo 'Setting up ngrok...'",
  'ngrok config add-authtoken "$NGROK_AUTH_TOKEN"',
  "echo 'Starting ngrok tunnel...'",
  'ngrok http --domain="$NGROK_DOMAIN" "$APP_PORT"',
]

[tasks.dev-server-start-container]
description = "Start development application in container"
run = [
  { task = "image-bake runtime_dev" },
  { task = "image-run runtime --hostname runtime --exposed-port 8080" },
]

[tasks.dev-worker-start]
description = "Start development worker"
run = [
  "echo 'Starting worker...'",
  ".venv/bin/python -m bin.temporalio_worker",
]

[tasks.dev-worker-start-container]
description = "Start development worker in container"
run = [
  { task = "image-bake worker_dev" },
  { task = "image-run worker" },
]

[tasks.dev-auxiliary-start]
description = "Start auxiliary services"
run = [
  "echo 'Starting auxiliary containers...'",
  "ENVIRONMENT=DEV mise run //docker:build",
  "ENVIRONMENT=DEV mise run //docker:start",
]

[tasks.dev-auxiliary-stop]
description = "Stop auxiliary services"
run = [
  "echo 'Stopping auxiliary containers...'",
  "ENVIRONMENT=DEV mise run //docker:stop",
]

[tasks.dev-auxiliary-clean]
description = "Stop and remove auxiliary services"
run = [
  "echo 'Stopping and removing auxiliary containers...'",
  "ENVIRONMENT=DEV mise run //docker:clean",
]

[tasks.update-from-template]
description = "Update service from template; TEMPLATE_PATH=<path> in the environment overrides the source"
run = [
  "echo 'Updating service from template...'",
  '''
  cookiecutter \
    --no-input \
    --overwrite-if-exists \
    --output-dir ../ \
    "${TEMPLATE_PATH:-https://github.com/ovsds/template-service-python}" \
    service_name='Speech To Text Bot Backend' \
    service_slug='speech-to-text-bot' \
    service_short_slug='backend' \
    python_version='3.14.8' \
    with_trivy='true' \
    with_ngrok='true' \
    with_docker='true' \
    with_aiogram_utils='true' \
    with_aiohttp_utils='true' \
    with_json_utils='true'
  ''',

  "echo 'Updating poetry.lock to the new pyproject.toml...'",
  # The task's environment predates the render: a changed Python pin needs a fresh venv and mise environment
  "rm -rf .venv",
  "mise install",
  "mise exec -- poetry lock",
]

[tasks.ci-image-push]
description = "Push runtime and worker images to registry for CI usage; needs IMAGE_REGISTRY, IMAGE_TAG and WORKER_IMAGE_TAG in the environment"
run = [
  ': "${IMAGE_REGISTRY:?}" "${IMAGE_TAG:?}" "${WORKER_IMAGE_TAG:?}"',
  "echo 'Building images runtime worker...'",
  "docker buildx bake runtime worker",
]

[tasks.ci-image-scan]
description = "Scan image for vulnerabilities; needs IMAGE_REGISTRY, IMAGE_NAME and IMAGE_TAG in the environment"
env = { TRIVY_DISABLE_VEX_NOTICE = "true" }
run = [
  'trivy image --config trivy.yaml "${IMAGE_REGISTRY:?}/${IMAGE_NAME:?}:${IMAGE_TAG:?}"',
]
